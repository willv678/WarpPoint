name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host:
    name: Host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows joins once the cross-platform socket layer lands (M1).
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  switch:
    name: Switch (.nro)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make -C switch -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: warppoint_switch
          path: switch/warppoint_switch.nro
          if-no-files-found: error

  nightly:
    name: Nightly release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [host, switch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: warppoint_switch

      - name: Publish nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly warppoint_switch.nro \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "Nightly build" \
            --notes "Automated build of ${GITHUB_SHA}."
